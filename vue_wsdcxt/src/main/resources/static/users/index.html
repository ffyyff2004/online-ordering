<!DOCTYPE html>
<html lang="zh">

<head>
    <meta charset="utf-8">
    <title>网上订餐系统</title>
    <link href="./themes/ecmoban_dangdang/style.css" rel="stylesheet" type="text/css" />
    <link href="./themes/index.css" rel="stylesheet" type="text/css" />
    <script type="text/javascript" src="./themes/index.js"></script>
    <script type="text/javascript" src="./themes/swiper.min.js"></script>
    <link rel="stylesheet" type="text/css" href="./themes/swiper.min.css" />
    <style>
        .swiper-container{
            width: 1200px;
            height: 300px;
            margin: 0px auto;
        }
        .swiper-slide img{
            width: 100%;
            height: 100%;
        }
    </style>
</head>

<body>
    <div id="app">
        <div class="top_nav">
            <div class="block">
                <ul class="top_bav_l">
                </ul>
                <div class="header_r">
                    <font id="ECS_MEMBERZONE" v-if="islogin"> 欢迎光临本站！ <s></s>&nbsp; <span> <a style="color: #FF6766;"
                        href="login.html">[用户登录]</a> <a style="color: #FF6766;" href="register.html">[用户注册]</a>
                </span>
                    </font>
                    <font id="ECS_MEMBERZONE" v-if="!islogin"> 你好 <b>{{ realname }}</b> <span><a
                        style="color: #FF6766;" href="cart.html">[购物车]</a><a style="color: #FF6766;" href="usercenter.html">[用户中心]</a> <a
                        style="color: #FF6766;" href="exit.html">[退出系统] </a> </span>
                    </font>
                </div>
            </div>
        </div>
        <div class="clearfix">
            <div class="block header">
                <div class="top">
                    <a href="index.html" class="logo"><img src="themes/ecmoban_dangdang/images/logo.gif" alt="" /></a>
                    <div class="top_search">
                        <input name="keywords" type="text" class="keyword" v-model="key" />
                        <input value="" id="seachbtn" type="button" @click="query">
                    </div>
                    <div class="head_r">
                        <div class="top_shopCart clearfix"></div>
                    </div>
                </div>
            </div>
        </div>
        <div style="clear: both"></div>
        <div class="menu_box clearfix">
            <div class="block">
                <div class="menu">
                    <a href="index.html" class="cur" rel="nofollow">网站首页</a>
                    <a href="article.html" class="cur" rel="nofollow">网站公告</a>
                    <a href="special.html" class="cur" rel="nofollow">特价食品</a>
                    <a href="recommend.html" class="cur" rel="nofollow">推荐食品</a>
                    <a href="all.html" class="cur" rel="nofollow">全部食品</a>
                </div>
            </div>
        </div>
        <div class="blank5"></div>
        <div class="block clearfix">
            <div class="swiper-container">
                <div class="swiper-wrapper">
                    <div class="swiper-slide"><img src="./pic/001.webp"></div>
                    <div class="swiper-slide"><img src="./pic/002.webp"></div>
                    <div class="swiper-slide"><img src="./pic/003.webp"></div>
                    <div class="swiper-slide"><img src="./pic/004.webp"></div>
                    <div class="swiper-slide"><img src="./pic/005.webp"></div>
                </div>
                <div class="swiper-pagination"></div>
            </div>
            <div class="blank"></div>
            <div class="goodsBox_1">
                <div class="xm-box" v-for="item in front" :key="item.cateid">
                    <h4 class="title">
                        <span>{{ item.catename }}</span> <a class="more" :href="'cate.html?id='+item.cateid+''">更多</a>
                    </h4>
                    <div id="show_new_area" class="clearfix">
                        <div class="pic" style='margin-left: 8px;' v-for="x in item.foodsList" :key="x.foodsid">
                            <a :href="'detail.html?id='+x.foodsid+''"><img :src="'http://localhost:8080/vue_wsdcxt/upfiles/'+x.image" class="img" /></a>
                            <p class="name">
                                <a :href="'detail.html?id='+x.foodsid+''" title="">{{x.foodsname}}</a>
                            </p>
                            <p class="price">
                                价格：
                                <font class="f1"> ￥{{x.price}}元 </font>
                            </p>
                        </div>
                    </div>
                </div>
                <div class="blank"></div>
            </div>
        </div>
        <div id="footer">
            <div class="footer">
                <div class="footer_nav_box">
                    <div class="footer_copyright">
                        <span> &copy; 网上订餐系统 版权所有，并保留所有权利。<br /> <br />服务时间：09:00-23:00<br /> <br /> <a href="../admin/index.html"
                            target="_blank">管理员入口</a>
                        </span>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
<script type="text/javascript" src="../admin/asset/js/jquery.js"></script>
<script type="text/javascript" src="../admin/asset/js/axios.min.js"></script>
<script type="text/javascript" src="../admin/asset/js/vue.js"></script>
<script type="text/javascript">
    const vue = new Vue({ // 实例化Vue对象
        el: '#app', // 绑定作用域
        data: { //定义数据 用于vue的双向绑定
            islogin: '',
            userid: '',
            realname: '',
            cate: {}, // 用来保存食品类型对象数据
            front: {}, // 用来保存前端显示数据
            key: '',
        },
        methods: {
            loadPage: function() {
                let _this = this;
                axios.get('http://localhost:8080/vue_wsdcxt/index/front.action').then(result => {
                    _this.cate = result.data.cateList;
                });
                axios.get('http://localhost:8080/vue_wsdcxt/index/index.action').then(result => {
                    _this.front = result.data.frontList;
                });
                _this.userid = sessionStorage.getItem('userid');
                _this.islogin = sessionStorage.getItem('userid') == null;
                _this.realname = sessionStorage.getItem('realname');
            },
            query: function() {
                let url = "query.html?id=" + this.key;
                window.location.href = url;
            },
        },
        created() { // 生命周期相关的函数
            this.loadPage();
        },
    })
</script>

</html>
