<!DOCTYPE html>
<html lang="zh">

<head>
    <meta charset="utf-8">
    <title>网上订餐系统</title>
    <link href="./themes/ecmoban_dangdang/style.css" rel="stylesheet" type="text/css" />
</head>

<body>
    <div id="app">
        <div class="top_nav">
            <div class="block">
                <ul class="top_bav_l">
                </ul>
                <div class="header_r">
                    <font id="ECS_MEMBERZONE" v-if="islogin"> 欢迎光临本站！ <s></s>&nbsp; <span> <a style="color: #FF6766;"
                        href="login.html">[用户登录]</a> <a style="color: #FF6766;" href="register.html">[用户注册]</a>
                </span>
                    </font>
                    <font id="ECS_MEMBERZONE" v-if="!islogin"> 你好 <b>{{ realname }}</b> <span><a
                        style="color: #FF6766;" href="cart.html">[购物车]</a><a style="color: #FF6766;" href="usercenter.html">[用户中心]</a> <a
                        style="color: #FF6766;" href="exit.html">[退出系统] </a> </span>
                    </font>
                </div>
            </div>
        </div>
        <div class="clearfix">
            <div class="block header">
                <div class="top">
                    <a href="index.html" class="logo"><img src="themes/ecmoban_dangdang/images/logo.gif" /></a>
                    <div class="top_search">
                        <input name="keywords" type="text" class="keyword" v-model="key" />
                        <input value="" id="seachbtn" type="button" @click="query">
                    </div>
                    <div class="head_r">
                        <div class="top_shopCart clearfix"></div>
                    </div>
                </div>
            </div>
        </div>
        <div style="clear: both"></div>
        <div class="menu_box clearfix">
            <div class="block">
                <div class="menu">
                    <a href="index.html" class="cur" rel="nofollow">网站首页</a>
                    <a href="article.html" class="cur" rel="nofollow">网站公告</a>
                    <a href="special.html" class="cur" rel="nofollow">特价食品</a>
                    <a href="recommend.html" class="cur" rel="nofollow">推荐食品</a>
                    <a href="all.html" class="cur" rel="nofollow">全部食品</a>
                </div>
            </div>
        </div>
        <div style="clear: both"></div>
        <div class="block box">
            <div class="blank"></div>
            <div id="ur_here">
                <a href="index.html">首页</a><code> &gt; </code> 食品列表
            </div>
        </div>
        <div class="blank"></div>
        <div class="block clearfix">
            <div class="AreaL">
                <div id="category_tree" class="category_tree">
                    <div class="title">所有食品分类</div>
                    <dl class="clearfix" style="background: #fafafa; width: 216px; padding: 0;">
                        <div class="box1 cate" id="cate">
                            <h1 style="border-top: none" v-for="item in cateList" :key="item.cateid">
                                <a :href="'cate.html?id='+item.cateid+''" class="  f_l">{{ item.catename }}</a>
                            </h1>
                        </div>
                        <div style="clear: both"></div>
                    </dl>
                </div>
                <div class="blank"></div>
                <div class="box" id='history_div'>
                    <div class="box_1">
                        <h3>
                            <span>猜你喜欢</span>
                        </h3>
                        <div class="boxCenterList clearfix" id='history_list'>
                            <ul class="clearfix" v-for="item in hotList" :key="item.foodsid">
                                <li class="goodsimg">
                                    <a :href="'detail.html?id='+item.foodsid+''" target="_blank"><img :src="'http://localhost:8080/vue_wsdcxt/upfiles/'+item.image" alt="" class="B_blue" /> </a>
                                </li>
                                <li><a :href="'detail.html?id='+item.foodsid+''" target="_blank" title="">{{item.foodsname}}</a> <br /> 价格：
                                    <font class="f1">￥{{item.price}}元</font>
                                </li>
                            </ul>
                        </div>
                    </div>
                </div>
                <div class="blank5"></div>
            </div>
            <div class="AreaR">
                <div class="box">
                    <div class="box_1">
                        <h3>
                            <span>食品列表</span>
                        </h3>
                        <div class="clearfix goodsBox" style="border: none; padding: 11px 0 10px 0px;">
                            <div class="goodsItem" v-for="item in foodsList" :key="item.foodsid">
                                <a :href="'detail.html?id='+item.foodsid+''"><img :src="'http://localhost:8080/vue_wsdcxt/upfiles/'+item.image" alt="" class="goodsimg" /></a><br />
                                <p>
                                    <a :href="'detail.html?id='+item.foodsid+''" title="">{{item.foodsname}}</a>
                                </p>
                                价格：
                                <font class="shop_s">￥{{item.price}}元</font><br />
                            </div>
                        </div>
                    </div>
                </div>
                <div class="blank5"></div>
                <!-- 存放分页的容器 -->
                <div id="layui" style="text-align: center"></div>
            </div>
        </div>
        <div id="footer">
            <div class="footer">
                <div class="footer_nav_box">
                    <div class="footer_copyright">
                        <span> &copy; 网上订餐系统 版权所有，并保留所有权利。<br /> <br />服务时间：09:00-23:00<br /> <br /> <a href="../admin/index.html"
                            target="_blank">管理员入口</a>
                        </span>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
<script type="text/javascript" src="../admin/asset/layui/layui.js"></script>
<script type="text/javascript" src="../admin/asset/js/jquery.js"></script>
<script type="text/javascript" src="../admin/asset/js/axios.min.js"></script>
<script type="text/javascript" src="../admin/asset/js/vue.js"></script>
<script type="text/javascript">
    const vue = new Vue({ // 实例化Vue对象
        el: '#app', // 绑定作用域
        data: { //定义数据 用于vue的双向绑定
            id: '',
            islogin: '',
            userid: '',
            realname: '',
            cate: '',
            cateList: {}, // 用来保存食品类型对象数据
            hotList: {},
            foodsList: {}, // 用来保存前端显示数据
            page: {},
            count: 0,
            page: 1,
            limit: 12,
            key: '',
        },
        methods: {
            loadTable: function() { // 查询食品信息的函数
                let _this = this;
                axios.get('http://localhost:8080/vue_wsdcxt/index/all.action?page=' + _this.page + '&limit=' + _this.limit).then(result => {
                    _this.foodsList = result.data.data;
                    _this.count = result.data.count;
                    if (_this.page == 1) {
                        layui.use(['laypage'], function() {
                            const laypage = layui.laypage;
                            laypage.render({
                                elem: 'layui', // 定义标签显示
                                count: vue.count, //数据量
                                limit: vue.limit, //每页限制
                                jump: function(obj, first) {
                                    if (!first) {
                                        vue.page = obj.curr;
                                        vue.loadTable();
                                    }
                                }
                            });
                        })
                    }
                });
            },
            loadPage: function() {
                let _this = this;
                axios.get('http://localhost:8080/vue_wsdcxt/index/front.action').then(result => {
                    _this.cateList = result.data.cateList;
                    _this.hotList = result.data.hotList;
                });
                _this.loadTable();
                _this.userid = sessionStorage.getItem('userid');
                _this.islogin = sessionStorage.getItem('userid') == null;
                _this.realname = sessionStorage.getItem('realname');
            },
            query: function() {
                let url = "query.html?id=" + this.key;
                window.location.href = url;
            },
        },
        created() { // 生命周期相关的函数
            this.loadPage();
        },
    })
</script>

</html>
