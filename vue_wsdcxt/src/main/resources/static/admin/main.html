<!doctype html>
<html lang="zh-cn">

<head>
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
    <title>网上订餐系统后台管理</title>
    <link rel="stylesheet" type="text/css" href="./asset/css/pintuer.css">
    <link rel="stylesheet" type="text/css" href="./asset/css/admin.css">
</head>

<body style="background-color:#f2f9fd;">
    <div id="app">
        <div class="header bg-main">
            <div class="logo margin-big-left fadein-top">
                <h1><img src="./asset/images/y.jpg" class="radius-circle rotate-hover" height="50" alt="" />网上订餐系统</h1>
            </div>
            <div class="head-l"><a href="javascript:;" @click="editpwd()" id="editpwd" class="button button-little bg-blue"><span
            class="icon-wrench"></span>
          修改密码</a> &nbsp;&nbsp;<a class="button button-little bg-red" href="javascript:;" @click="exit()" id="exit"><span
            class="icon-power-off"></span> 退出登录</a> </div>
        </div>
        <div class="leftnav">
            <div class="leftnav-title"><strong><span class="icon-list"></span>菜单列表</strong></div>
            <h2><span class="icon-user-md"></span>管理员信息管理</h2>
            <ul>
                <li><a href="listadmin.html" target="right"><span class="icon-caret-right"></span>管理员信息列表</a></li>
            </ul>
            <h2><span class="icon-user"></span>用户信息管理</h2>
            <ul>
                <li><a href="listusers.html" target="right"><span class="icon-caret-right"></span>用户信息列表</a></li>
            </ul>
            <h2><span class="icon-reorder"></span>新闻公告管理</h2>
            <ul>
                <li><a href="listarticle.html" target="right"><span class="icon-caret-right"></span>新闻公告列表</a></li>
            </ul>
            <h2><span class="icon-reorder"></span>食品类型管理</h2>
            <ul>
                <li><a href="listcate.html" target="right"><span class="icon-caret-right"></span>食品类型列表</a></li>
            </ul>
            <h2><span class="icon-reorder"></span>食品信息管理</h2>
            <ul>
                <li><a href="listfoods.html" target="right"><span class="icon-caret-right"></span>食品信息列表</a></li>
            </ul>
            <h2><span class="icon-reorder"></span>订单信息管理</h2>
            <ul>
                <li><a href="listorders.html" target="right"><span class="icon-caret-right"></span>订单信息列表</a></li>
            </ul>
            <h2><span class="icon-reorder"></span>评价信息管理</h2>
            <ul>
                <li><a href="listtopic.html" target="right"><span class="icon-caret-right"></span>评价信息列表</a></li>
            </ul>
            <h2><span class="icon-reorder"></span>意见反馈管理</h2>
            <ul>
                <li><a href="listcomplains.html" target="right"><span class="icon-caret-right"></span>意见反馈列表</a></li>
            </ul>
            <div class="admin">
                <iframe scrolling="auto" rameborder="0" src="welcome.html" name="right" width="100%" height="100%"></iframe>
            </div>
        </div>

        <script type="text/javascript" src="./asset/js/jquery.js"></script>
        <script type="text/javascript" src="./asset/layui/layui.js"></script>
        <script type="text/javascript" src="./asset/js/tool.js"></script>
        <script type="text/javascript" src="./asset/js/axios.min.js"></script>
        <script type="text/javascript" src="./asset/js/vue.js"></script>
        <script type="text/javascript">
            $(function() {
                $(".leftnav h2").click(function() {
                    $(this).next().slideToggle(200);
                    $(this).toggleClass("on");
                })
                $(".leftnav ul li a").click(function() {
                    $("#a_leader_txt").text($(this).text());
                    $(".leftnav ul li a").removeClass("on");
                    $(this).addClass("on");
                })
            });

            const vue = new Vue({ // 实例化Vue对象
                el: '#app', // 绑定作用域
                data: { //定义数据
                    adminname: '',
                    realname: '',
                    role: '',
                },
                methods: {
                    exit: function() {
                        if (window.confirm('确定要退出吗？')) {
                            sessionStorage.clear(); // 删除sesstion数据
                            window.location.href = 'index.html';
                        }
                    },
                    editpwd: function() {
                        layer_show('修改密码', 'editpwd.html', 800, 450);
                    },
                    loadPage: function() {
                        this.adminname = sessionStorage.getItem('adminname');
                        this.realname = sessionStorage.getItem('realname');
                        this.role = sessionStorage.getItem('role');
                    },
                },
                // 生命周期相关的函数
                created() {
                    this.loadPage();
                },
            })
        </script>
</body>

</html>
