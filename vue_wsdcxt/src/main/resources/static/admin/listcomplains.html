<!doctype html>
<html lang="zh-cn">

<head>
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
    <title>意见反馈信息列表</title>
    <link rel="stylesheet" href="./asset/css/pintuer.css" />
    <link rel="stylesheet" href="./asset/css/admin.css" />
    <link rel="stylesheet" href="./asset/layui/css/layui.css" />
</head>

<div class="panel admin-panel" id="app">
    <div class="panel-head"><strong class="icon-reorder"> 意见反馈信息列表</strong></div>
    <div class="padding border-bottom">
        <ul class="search" style="padding-left:10px;">
            <li> <input type="text" name="keywords" class="input" id="keywords" v-model="keywords" placeholder="请输入用户" style="width:250px; line-height:17px;display:inline-block" /> <a class="button border-blue icon-search" title="查询" @click="query()"> 查询</a>                </li>
            <li> <a class="button border-red icon-trash-o" title="批量删除" @click="datadel()"> 批量删除</a> </li>
            <li> <a class="button border-main icon-plus-square-o" href="javascript:;" onclick="openForm('添加意见反馈','addcomplains.html')" title="添加意见反馈"> 添加意见反馈</a> </li>
            <li> <a class="button border-green icon-recycle" href="javascript:;" title="刷新数据" onclick="location.reload()">
            刷新数据</a> </li>
        </ul>
    </div>
    <table class="table table-hover text-center">
        <thead>
            <tr>
                <th style="text-align: center" width="50">&nbsp;</th>
                <th style="text-align: center">用户</th>
                <th style="text-align: center">标题</th>
                <th style="text-align: center">内容</th>
                <th style="text-align: center">日期</th>
                <th style="text-align: center">状态</th>
                <th style="text-align: center">管理回复</th>
                <th style="text-align: center" width="250">操作</th>
            </tr>
        </thead>
        <tbody>
            <tr v-for="item in complains" :key="item.complainsid">
                <td style="text-align: center"><input type="checkbox" :value="item.complainsid" placeholder="请选择" v-model="ids"></td>
                <td style="text-align: center">{{ item.username }}</td>
                <td style="text-align: center">{{ item.title }}</td>
                <td style="text-align: center">{{ item.contents }}</td>
                <td style="text-align: center">{{ item.addtime }}</td>
                <td style="text-align: center">{{ item.status }}</td>
                <td style="text-align: center">{{ item.reps }}</td>
                <td style="text-align: center"><span v-if="item.status == '未回复'">
			<a href="javascript:;" title="回复" @click="getComplainsById(item.complainsid)">回复</a>&nbsp;&nbsp;</span><a class="button border-red button-small" href="javascript:;" @click="deleteComplains(item.complainsid)"><span class="icon-trash-o"></span> 删除</a></td>
            </tr>
            <tr>
                <td colspan="8">
                    <!-- 存放分页的容器 -->
                    <div id="layui" class="r"></div>
                </td>
            </tr>
        </tbody>
    </table>
</div>

<script type="text/javascript" src="./asset/js/jquery.js"></script>
<script type="text/javascript" src="./asset/js/pintuer.js"></script>
<script type="text/javascript" src="./asset/layui/layui.js"></script>
<script type="text/javascript" src="./asset/js/tool.js"></script>
<script type="text/javascript" src="./asset/js/axios.min.js"></script>
<script type="text/javascript" src="./asset/js/vue.js"></script>
<script type="text/javascript">
    const vue = new Vue({ // 实例化Vue对象
        el: '#app', // 绑定作用域
        data: { //定义数据
            complains: [],
            ids: [], // 定义批量删除的数组
            page: {},
            count: 0,
            page: 1,
            limit: 10,
            keywords: '', //查询关键字
        },
        created() { // 生命周期相关的函数
            this.loadTable(); // 调用查询意见反馈信息的方法
        },
        methods: {
            loadTable: function() { // 查询意见反馈信息的函数
                let _this = this;
                axios.get('http://localhost:8080/vue_wsdcxt/complains/getComplainsByPage.action?page=' + _this.page + '&limit=' + _this.limit).then(result => {
                    _this.complains = result.data.data;
                    _this.count = result.data.count;
                    if (_this.page == 1) {
                        _this.loadPage();
                    }
                });
            },
            loadPage: function() { // 调用LayUI分页标签的使用
                layui.use(['laypage'], function() {
                    const laypage = layui.laypage;
                    laypage.render({
                        elem: 'layui', // 定义标签显示
                        count: vue.count, //数据量
                        limit: vue.limit, //每页限制
                        jump: function(obj, first) {
                            if (!first) {
                                vue.page = obj.curr;
                                vue.loadTable();
                            }
                        }
                    });
                })
            },
            deleteComplains: function(complainsid) { // 根据主键删除意见反馈信息
                let _this = this;
                if (window.confirm('确定要删除这条记录吗？')) {
                    axios.get('http://localhost:8080/vue_wsdcxt/complains/deleteComplains.action?id=' + complainsid).then(result => {
                        if (result.data.code > 0) {
                            _this.loadTable();
                        } else {
                            alert('系统错误，请稍后再试');
                        }
                    });
                }
            },
            datadel: function() { // 批量删除意见反馈信息
                let _this = this;
                if (window.confirm('确定要批量删除记录吗？')) {
                    axios.post('http://localhost:8080/vue_wsdcxt/complains/deleteComplainsByIds.action', _this.ids).then(result => {
                        if (result.data.code > 0) {
                            _this.loadTable();
                        } else {
                            alert('系统错误，请稍后再试');
                        }
                    });
                }
            },
            query: function() {
                let _this = this;
                axios.get('http://localhost:8080/vue_wsdcxt/complains/getComplains.action?page=' + _this.page + '&limit=' + _this.limit + '&keywords=' + _this.keywords).then(result => {
                    _this.complains = result.data.data;
                    _this.count = result.data.count;
                    if (_this.page == 1) {
                        _this.loadPage();
                    }
                });
            },
            status: function(complainsid) {
                let _this = this;
                axios.get('http://localhost:8080/vue_wsdcxt/complains/status.action?id=' + complainsid).then(result => {
                    if (result.data.code > 0) {
                        _this.loadTable();
                    } else {
                        alert('系统错误，请稍后再试');
                    }
                });
            },
            getComplainsById: function(complainsid) { // 编辑按钮点击事件
                let url = 'editcomplains.html?id=' + complainsid;
                layer_show('编辑意见反馈', url, 1000, 500);
            },
        },
    });
</script>

</body>

</html>
