<!doctype html>
<html lang="zh-cn">

<head>
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
  <title>编辑食品信息</title>
  <link rel="stylesheet" type="text/css" href="./asset/css/pintuer.css" />
  <link rel="stylesheet" type="text/css" href="./asset/css/admin.css" />
</head>

<body>
  <div class="panel admin-panel" id="app">
    <div class="body-content">
      <div class="form-x">
        <div class="form-group">
          <div class="label">
            <label>食品名称：</label>
          </div>
          <div class="field">
            <input type="text" class="input" style="width:420px;" id="foodsname" v-model="foodsname" placeholder="请输入食品名称" />
          </div>
        </div>
        <div class="form-group">
          <div class="label">
            <label>食品图片：</label>
          </div>
          <div class="field">
            <form id="head-img" enctype="multipart/form-data">
              <input type="file" name="image" id="image" placeholder="食品图片" />
              <button type="button" class="button bg-blue margin-left icon-upload" id="btnUpload"  @click.prevent="upload()"> 文件上传 </button>
            </form>
          </div>
        </div>
        <div class="form-group">
          <div class="label">
            <label>食品类型：</label>
          </div>
          <div class="field">
            <select id="cateid" title="食品类型" v-model="cateid" class="input" style="width:420px;" >
              <option :value="item.cateid" v-for="item in cate">{{ item.catename }}</option>
            </select>
          </div>
        </div>
        <div class="form-group">
          <div class="label">
            <label>销售价格：</label>
          </div>
          <div class="field">
            <input type="text" class="input" style="width:420px;" id="price" v-model="price" placeholder="请输入销售价格" />
          </div>
        </div>
        <div class="form-group">
          <div class="label">
            <label>是否推荐：</label>
          </div>
          <div class="field" style="padding-top:8px;">
          	<input type="radio" id="recommend-1" v-model="recommend" value="是" checked>是
          	<input type="radio" id="recommend-1" v-model="recommend" value="否">否
          </div>
        </div>
        <div class="form-group">
          <div class="label">
            <label>是否特价：</label>
          </div>
          <div class="field" style="padding-top:8px;">
          	<input type="radio" id="special-1" v-model="special" value="是" checked>是
          	<input type="radio" id="special-1" v-model="special" value="否">否
          </div>
        </div>
        <div class="form-group">
          <div class="label">
            <label>食品介绍：</label>
          </div>
          <div class="field">
            <textarea class="input" id="contents" v-model="contents" style="height: 220px;" placeholder="请输入食品介绍" ></textarea>
          </div>
        </div>
        <div class="form-group">
          <div class="label">
            <label></label>
          </div>
          <div class="field">
            <button class="button bg-main icon-check" type="button" @click.prevent="update()"> 提交保存</button>
            <button class="button bg-gray icon-recycle" type="button" @click.prevent="reset()"> 取消重置</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script type="text/javascript" src="./asset/js/jquery.js"></script>
  <script type="text/javascript" src="./asset/js/pintuer.js"></script>
  <script type="text/javascript" src="./asset/layui/layui.js"></script>
  <script type="text/javascript" src="./asset/js/axios.min.js"></script>
  <script type="text/javascript" src="./asset/js/vue.js"></script>
  <script type="text/javascript">
		const vue = new Vue({
			el: '#app',// 绑定作用域
			data: { //定义数据用于vue的双向绑定
				foodsid: '',
				foodsname: '', // 食品名称
				url: '', // 食品图片
				cateid: '', // 食品类型
				price: '', // 销售价格
				recommend: '是', // 是否推荐
				special: '是', // 是否特价
				contents: '', // 食品介绍
				cate: {},// 用来保存食品类型对象数据
			},
			methods: {
				getUrlParam: function () {
					var name, value;
					var str = location.href; // 取得整个地址栏
					var num = str.indexOf("?"); // 定位参数起始位置
					str = str.substr(num + 1); // 取得所有参数 
					var arr = str.split("&"); // 各个参数放到数组里
					for (var i = 0; i < arr.length; i++) {
						num = arr[i].indexOf("=");
						if (num > 0) {
							name = arr[i].substring(0, num);
							value = arr[i].substr(num + 1);
							this.foodsid = value; // 确认主键参数
						}
					}
				},
				loadPage: function () {
					let _this = this;
					axios.get('http://localhost:8080/vue_wsdcxt/foods/getFoodsById.action?id=' + _this.foodsid).then(result => {
						_this.foodsname= result.data.foodsname;
						_this.url= result.data.image;
						_this.cateid= result.data.cateid;
						_this.price= result.data.price;
						_this.recommend= result.data.recommend;
						_this.special= result.data.special;
						_this.contents= result.data.contents;
					});
					axios.get('http://localhost:8080/vue_wsdcxt/cate/getAllCate.action').then(result => {
						_this.cate = result.data;
					});
				},
				reset: function () {
					this.loadPage();
				},
				upload: function () {
					let _this = this;
					var formData = new FormData($('#head-img')[0]);
					axios.post('http://localhost:8080/vue_wsdcxt/ajaxupload/upload.action', formData).then(result => {
						_this.url = result.data.url;
						alert('上传成功');
					});
				},
				update: function () {
					let _this = this;
					var data = {
						foodsid: _this.foodsid,
						foodsname: _this.foodsname,
						image: _this.url,
						cateid: $('#cateid').val(),
						price: _this.price,
						recommend: _this.recommend,
						special: _this.special,
						contents: _this.contents,
					};
					axios.post('http://localhost:8080/vue_wsdcxt/foods/updateFoods.action', data).then(result => {
						if (result.data.code > 0) {
							var index = parent.layer.getFrameIndex(window.name);
							parent.location.reload();
							parent.layer.close(index);
						} else {
							alert('修改失败');
						}
					});
				},
			},

			created() { // 生命周期相关的函数
				this.getUrlParam();
				this.loadPage();
				let _this = this;
			},
		})
	</script>

</body>

</html>
